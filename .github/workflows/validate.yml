name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Layout first: it is the cheapest check and the one whose failure makes
      # every later error confusing. Shared with vmgm/agent-skills so a skill
      # has the same shape wherever it lives.
      - name: Every skill has the same layout
        run: ./scripts/lint-shape.sh
      - name: Nothing machine-specific ships
        run: ./scripts/lint-portability.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python scripts/build.py
