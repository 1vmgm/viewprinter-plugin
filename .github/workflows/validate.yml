name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Layout first: it is the cheapest check and the one whose failure makes
      # every later error confusing. Shared with vmgm/agent-skills so a skill
      # has the same shape wherever it lives.
      - name: Every skill has the same layout
        run: ./scripts/lint-shape.sh
      - name: Nothing machine-specific ships
        run: ./scripts/lint-portability.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # This repository is public: no account ids, home paths or private
      # addresses. CI has no private/denylist.txt, so names are caught by the
      # commit hook on the machine that has one; see AGENTS.md.
      - name: Nothing private ships
        run: python scripts/lint_privacy.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python scripts/build.py
  # The helpers run on the customer's machine, so they are tested where customers
  # are: Linux, macOS and Windows, on the Python macOS ships (3.9) and a current one.
  helpers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Every skill's helpers, found on disk so a new skill's tests run without
      # anyone remembering to add a line here.
      - name: Every skill's own helpers
        shell: bash
        run: |
          for scripts in skills/*/scripts; do
            echo "::group::$scripts"
            python -m unittest discover -s "$scripts" -p 'test_*.py' -v || exit 1
            echo "::endgroup::"
          done
